# Manual troubleshooting: shows what wpcodie.com serves and how the FTP account's folders
# are laid out. Run it from the Actions tab (Diagnose hosting -> Run workflow).
name: Diagnose hosting

on:
  workflow_dispatch:
    inputs:
      find:
        description: Text to look for in the live page (optional)
        required: false
        default: ''
      page:
        description: Which page to search for that text (path, e.g. /preview/)
        required: false
        default: '/'
      urls:
        description: Space-separated addresses to check for embedding (status and frame headers only)
        required: false
        default: ''

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: What the live site serves
        env:
          FIND: ${{ inputs.find }}
          PAGE: ${{ inputs.page }}
        run: |
          echo "== DNS"; dig +short wpcodie.com A; dig +short www.wpcodie.com
          for u in https://wpcodie.com/ https://www.wpcodie.com/ http://wpcodie.com/; do
            echo "== $u"
            curl -sS -I -L --max-time 20 "$u" | grep -iE '^(HTTP|location|server|x-|cache|cf-|age|last-modified|platform|content-type)' || true
            curl -sSL --max-time 20 "$u" | grep -o '<title>[^<]*</title>' | head -1 || true
          done
          echo "== live homepage: all response headers, and which build it is"
          curl -sS -D - -o /tmp/home.html --max-time 20 -H 'Accept-Encoding: gzip' --compressed https://wpcodie.com/ || true
          echo "build script: $(grep -o '/_astro/Page[^"]*\.js' /tmp/home.html | head -1)"
          echo "has floating CTA (m-cta): $(grep -c 'm-cta' /tmp/home.html)"
          echo "phone swipe rows (sw-row, expect 3): $(grep -o 'sw-row' /tmp/home.html | wc -l)"
          echo "How we operate swipe row (ops-cards): $(grep -o 'ops-cards' /tmp/home.html | wc -l)"
          if [ -n "$FIND" ]; then
            curl -sS --compressed --max-time 20 "https://wpcodie.com${PAGE}?nocache=$(date +%s)" -o /tmp/page.html || true
            echo "== live page ${PAGE} contains \"$FIND\": $(grep -o -F -- "$FIND" /tmp/page.html | wc -l) time(s)"
            grep -o -F -- "$FIND" /tmp/page.html | head -3 || true
          fi
          echo "== llms.txt (exists only in the new build)"
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 https://wpcodie.com/llms.txt || true
          curl -sS --max-time 20 https://wpcodie.com/llms.txt | head -2 || true
      - name: Reachability from other countries, certificate, DNS and TLS
        run: |
          echo "== DNS A / AAAA"; dig +short wpcodie.com A; echo "AAAA:"; dig +short wpcodie.com AAAA; echo "NS:"; dig +short wpcodie.com NS
          echo "== email security (stops others sending mail as @wpcodie.com)"
          echo "MX:"; dig +short wpcodie.com MX
          echo "SPF / TXT:"; dig +short wpcodie.com TXT
          echo "DMARC:"; dig +short _dmarc.wpcodie.com TXT
          for sel in hostingermail1 hostingermail2 hostingermail3 default google selector1 selector2 dkim; do r=$(dig +short ${sel}._domainkey.wpcodie.com TXT); [ -n "$r" ] && echo "DKIM $sel: $(echo $r | cut -c1-80)..."; done; true
          echo "CAA (who may issue certificates):"; dig +short wpcodie.com CAA
          echo "== certificate (issuer, dates, chain)"
          echo | openssl s_client -connect wpcodie.com:443 -servername wpcodie.com -showcerts 2>/dev/null | grep -E '^ *[0-9] s:|^ *i:' || true
          echo | openssl s_client -connect wpcodie.com:443 -servername wpcodie.com 2>/dev/null | openssl x509 -noout -issuer -subject -dates || true
          for v in tls1 tls1_1 tls1_2 tls1_3; do
            r=$(echo | timeout 10 openssl s_client -connect wpcodie.com:443 -servername wpcodie.com -$v 2>&1 | grep -E '^ *Protocol|Cipher is' | head -1)
            echo "TLS $v: ${r:-not accepted}"
          done
          echo "== IPv6 reachability"; curl -6 -sS -o /dev/null -w "%{http_code}\n" --max-time 15 https://wpcodie.com/ || echo "(no IPv6 from this runner)"
          echo "== check-host.net: HTTP check from servers in many countries"
          id=$(curl -sS --max-time 20 -H 'Accept: application/json' "https://check-host.net/check-http?host=https://wpcodie.com/&max_nodes=40" | python3 -c 'import sys,json; print(json.load(sys.stdin)["request_id"])' 2>/dev/null || true)
          if [ -n "$id" ]; then
            sleep 25
            curl -sS --max-time 20 -H 'Accept: application/json' "https://check-host.net/check-result/$id" > /tmp/r.json || true
            curl -sS --max-time 20 -H 'Accept: application/json' "https://check-host.net/nodes/hosts" > /tmp/n.json || true
            python3 - <<'PY'
          import json
          r=json.load(open('/tmp/r.json')); n=json.load(open('/tmp/n.json')).get('nodes',{})
          for node,res in sorted(r.items(), key=lambda kv: (n.get(kv[0],{}).get('location',['?'])[1] if n.get(kv[0]) else '?')):
              loc=n.get(node,{}).get('location',['?','?','?'])
              where=f"{loc[1]} / {loc[2]}" if len(loc)>2 else str(loc)
              if res is None: out='(no answer yet)'
              else:
                  x=res[0]
                  out=f"ok={x[0]} time={x[1]:.2f}s {x[2]} {x[3] if len(x)>3 else ''}" if x and x[0] is not None else str(x)
              print(f"{where:40} {out}")
          PY
          else
            echo "(check-host.net did not answer)"
          fi
      - name: What Googlebot gets for the sitemaps and robots.txt
        run: |
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for u in https://wpcodie.com/robots.txt https://wpcodie.com/sitemap-index.xml https://wpcodie.com/sitemap-0.xml; do
            echo "== $u (as Googlebot)"
            curl -sS -D - -o /tmp/body --max-time 20 -A "$UA" -H 'Accept-Encoding: gzip, deflate, br' "$u" | tr -d '\r' || true
            echo "-- body bytes: $(wc -c < /tmp/body); first bytes (hex):"; head -c 16 /tmp/body | od -An -tx1 || true
            echo "-- decoded start:"; curl -sS --compressed --max-time 20 -A "$UA" "$u" | head -c 400; echo
          done
      - name: Can these addresses be embedded in wpcodie.com?
        if: ${{ inputs.urls != '' }}
        run: |
          for u in ${{ inputs.urls }}; do
            echo "== $u"
            curl -sS -I -L --max-time 20 -A 'Mozilla/5.0' "$u" | grep -iE '^(HTTP|location|x-frame-options|content-security-policy)' | cut -c1-400 || true
          done
      - name: Contact form endpoint (no email is sent by these checks)
        run: |
          echo "== GET (expect 405: PHP runs, only POST allowed)"
          curl -sS -w " -> HTTP %{http_code}\n" --max-time 20 https://wpcodie.com/contact.php || true
          echo "== POST with an invalid email (expect 422: validation works)"
          curl -sS -w " -> HTTP %{http_code}\n" --max-time 20 -H 'Content-Type: application/json' -d '{"name":"Check","email":"not-an-email"}' https://wpcodie.com/contact.php || true
          echo "== POST that fills the spam trap (expect 200 and ok:true, but nothing is sent)"
          curl -sS -w " -> HTTP %{http_code}\n" --max-time 20 -H 'Content-Type: application/json' -d '{"name":"Check","email":"check@example.com","website":"bot"}' https://wpcodie.com/contact.php || true
          echo "== Is PHP mail() available on this host?"
          curl -sS -I --max-time 20 https://wpcodie.com/contact.php | grep -iE "^(HTTP|x-powered-by|content-type)" || true
      - name: FTP folder layout
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "domains/" "../" "../../" "../../../"; do
            echo "== /$d"; curl -sS --path-as-is --max-time 30 --user "$U:$P" "ftp://$S/$d" || true
          done
          for dom in $(curl -sS --max-time 30 --list-only --user "$U:$P" "ftp://$S/domains/" 2>/dev/null); do
            echo "== /domains/$dom/public_html/"; curl -sS --max-time 30 --user "$U:$P" "ftp://$S/domains/$dom/public_html/" || true
          done
          echo "== where is WordPress (wp-config.php)?"
          for d in "../" "../../" "../public_html/" "../../public_html/" "../domains/" "../../domains/"; do
            echo "-- $d"; curl -sS --path-as-is --max-time 30 --list-only --user "$U:$P" "ftp://$S/$d" 2>&1 | head -40 || true
          done
      - name: The wpcodie.com web root and its current .htaccess
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p backup
          echo "== /domains/wpcodie.com/public_html/"
          curl -sS --max-time 30 --user "$U:$P" "ftp://$S/%2Fdomains/wpcodie.com/public_html/" || true
          curl -sS --max-time 30 --user "$U:$P" "ftp://$S/%2Fdomains/wpcodie.com/public_html/.htaccess" -o backup/htaccess.txt || true
          echo "== current .htaccess"; cat backup/htaccess.txt || true
          echo "== saved enquiries (names and sizes only; contents are never printed)"
          curl -sS --max-time 30 --user "$U:$P" "ftp://$S/%2Fdomains/wpcodie.com/enquiries/" || echo "(no enquiries folder yet)"
      - uses: actions/upload-artifact@v4
        with:
          name: webroot-htaccess-current
          path: backup/
          include-hidden-files: true
          retention-days: 90
